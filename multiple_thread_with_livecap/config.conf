# ============================================================
# Packet Capture & Forward Configuration File
# ============================================================
# This file configures the packet capture system to capture
# packets from a local interface and forward them through
# multiple WAN interfaces for load balancing.
# ============================================================

# ------------------------------------------------------------
# LOCAL INTERFACE CONFIGURATION
# ------------------------------------------------------------
# Specify the network interface to capture packets from
# This is typically your LAN interface connected to clients
# Format: local <interface_name>
# Example: local ens38, local eth0, local enp0s3
# ------------------------------------------------------------

local ens38


# ------------------------------------------------------------
# WAN INTERFACE CONFIGURATION
# ------------------------------------------------------------
# Configure WAN interfaces for forwarding captured packets
# Multiple WAN interfaces enable load balancing and redundancy
#
# Format: wan <local_interface:local_port> <peer_ip:peer_port>
#
# Where:
#   - local_interface: Network interface name (e.g., ens33, eth1)
#   - local_port: UDP port to bind on this interface
#   - peer_ip: IP address of the remote peer/destination
#   - peer_port: UDP port on the remote peer
#
# Notes:
#   - You can configure multiple WAN interfaces
#   - Packets will be load-balanced across all WAN interfaces
#   - Load balancing uses flow hash for consistent routing
# ------------------------------------------------------------

# WAN 1: First path through ens33
# Local: 192.168.203.1:5001 -> Remote: 192.168.203.2:5001
wan ens33:5001 192.168.203.2:5001

# WAN 2: Second path through ens37
# Local: 192.168.11.1:5002 -> Remote: 192.168.11.2:5002
wan ens37:5002 192.168.11.2:5002

# WAN 3: Optional third path (uncomment to enable)
# wan ens39:5003 192.168.50.2:5003

# WAN 4: Optional fourth path (uncomment to enable)
# wan ens40:5004 192.168.60.2:5004


# ============================================================
# CONFIGURATION EXAMPLES
# ============================================================

# Example 1: Simple 2-WAN setup
# ------------------------------
# local eth0
# wan eth1:5001 10.0.1.2:5001
# wan eth2:5002 10.0.2.2:5002

# Example 2: 4-WAN setup with different networks
# -----------------------------------------------
# local enp0s8
# wan enp0s3:6001 192.168.1.100:6001
# wan enp0s9:6002 192.168.2.100:6002
# wan enp0s10:6003 192.168.3.100:6003
# wan enp0s16:6004 192.168.4.100:6004

# Example 3: Testing on localhost
# --------------------------------
# local lo
# wan lo:7001 127.0.0.1:8001
# wan lo:7002 127.0.0.1:8002


# ============================================================
# IMPORTANT NOTES
# ============================================================
# 1. Lines starting with '#' are comments and will be ignored
# 2. Empty lines are ignored
# 3. Whitespace at the beginning and end of lines is trimmed
# 4. The 'local' directive must be specified
# 5. At least one 'wan' directive must be specified
# 6. Maximum 10 WAN interfaces supported (configurable in code)
# 7. Interface names must exist on your system
# 8. Ensure firewall rules allow traffic on specified ports
# 9. Run 'ip addr' or 'ifconfig' to see available interfaces
# 10. Program must run with root/sudo privileges for packet capture
# ============================================================

# ============================================================
# VERIFICATION COMMANDS
# ============================================================
# Check available interfaces:
#   ip addr
#   ifconfig -a
#
# Check interface is up:
#   ip link show <interface>
#
# Test connectivity to peer:
#   ping <peer_ip>
#
# Check if port is in use:
#   netstat -tulpn | grep <port>
#   ss -tulpn | grep <port>
# ============================================================